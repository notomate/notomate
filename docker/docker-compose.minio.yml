services:
  mysql:
    image: mysql:8.4
    container_name: notomate-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: notomate
      MYSQL_USER: notomate
      MYSQL_PASSWORD: notomate_password
      MYSQL_ROOT_PASSWORD: notomate_root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  minio:
    image: minio/minio:latest
    container_name: notomate-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"  # MinIO API
      - "9001:9001"  # MinIO Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: notomate-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/notomate --ignore-existing;
      mc anonymous set download myminio/notomate;
      exit 0;
      "

  notomate-nginx:
    build:
      context: ..
      dockerfile: Dockerfile
      target: nginx-runtime
    image: notomate/notomate-nginx:local
    container_name: notomate-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - notomate-api
      - notomate-collab

  notomate-collab:
    build:
      context: ..
      dockerfile: Dockerfile
      target: collab-runtime
    image: notomate/notomate-collab:local
    container_name: notomate-collab
    restart: unless-stopped
    environment:
      PORT: 3000
      APP_SECRET: ${APP_SECRET}
      GRPC_ADDR: notomate-api:50051
    depends_on:
      - notomate-api

  notomate-api:
    build:
      context: ..
      dockerfile: Dockerfile
      target: api-runtime
    image: notomate/notomate-api:local
    container_name: notomate-api
    restart: unless-stopped
    volumes:
      - ../bin:/usr/local/app/bin
    environment:
      DB_DRIVER: mysql
      DB_DSN: "notomate:notomate_password@tcp(mysql:3306)/notomate?charset=utf8mb4"
      STORAGE_TYPE: s3
      STORAGE_S3_ENDPOINT: minio:9000
      STORAGE_S3_ACCESS_KEY: minioadmin
      STORAGE_S3_SECRET_KEY: minioadmin
      STORAGE_S3_BUCKET: notomate
      STORAGE_S3_USE_SSL: "false"
      PORT: 8080
      APP_DISABLE_SIGNUP: ${APP_DISABLE_SIGNUP}
      APP_SECRET: ${APP_SECRET}
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  mysql_data:
    driver: local
  minio_data:
    driver: local
