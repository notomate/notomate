name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  backend-test:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: api/go.sum

      - name: Install dependencies
        working-directory: ./api
        run: go mod download

      - name: Run go vet
        working-directory: ./api
        run: go vet ./...

      - name: Run go test
        working-directory: ./api
        env:
          NOTOMATE_TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Build api
        working-directory: ./api
        run: go build -o bin/api ./cmd/api/main.go

  runner-test:
    name: Runner Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: runner/go.sum

      - name: Install dependencies
        working-directory: ./runner
        run: go mod download

      - name: Run go vet
        working-directory: ./runner
        run: go vet ./...

      - name: Run go test
        working-directory: ./runner
        run: |
          go test -v -race ./...
          go -C third_party/act test -v -race ./pkg/container

      - name: Build runner
        working-directory: ./runner
        run: go build -o bin/notomate-runner .

  frontend-test:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            web/package-lock.json
            packages/editor/package-lock.json

      # web depends on file:../packages/editor, whose build output (dist) is not committed.
      - name: Install editor package dependencies
        working-directory: ./packages/editor
        run: npm ci

      - name: Test editor package
        working-directory: ./packages/editor
        run: npm test

      - name: Build editor package
        working-directory: ./packages/editor
        run: npm run build

      - name: Install dependencies
        working-directory: ./web
        run: npm ci

      - name: Build frontend
        working-directory: ./web
        run: npm run build

  collab-test:
    name: Collab Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            collab/package-lock.json
            packages/editor/package-lock.json

      # collab imports the TipTap converter from file:../packages/editor (dist/convert.js).
      - name: Build editor package
        working-directory: ./packages/editor
        run: npm ci && npm run build

      - name: Install dependencies
        working-directory: ./collab
        run: npm ci

      - name: Run tests
        working-directory: ./collab
        run: npm test

  docker-build-test:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, collab-test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: notomate:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The default (last) stage is nginx; collab has its own build path through the editor package.
      - name: Build collab image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: collab-runtime
          push: false
          tags: notomate-collab:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  runner-docker-build-test:
    name: Runner Docker Build Test
    runs-on: ubuntu-latest
    needs: [runner-test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build runner Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./runner
          file: ./runner/Dockerfile
          push: false
          tags: notomate-runner:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  pr-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [backend-test, runner-test, frontend-test, collab-test, docker-build-test, runner-docker-build-test]
    if: always()

    steps:
      - name: Check results
        run: |
          echo "Backend Test: ${{ needs.backend-test.result }}"
          echo "Runner Test: ${{ needs.runner-test.result }}"
          echo "Frontend Test: ${{ needs.frontend-test.result }}"
          echo "Collab Test: ${{ needs.collab-test.result }}"
          echo "Docker Build Test: ${{ needs.docker-build-test.result }}"
          echo "Runner Docker Build Test: ${{ needs.runner-docker-build-test.result }}"

          if [ "${{ needs.backend-test.result }}" != "success" ] || \
             [ "${{ needs.runner-test.result }}" != "success" ] || \
             [ "${{ needs.frontend-test.result }}" != "success" ] || \
             [ "${{ needs.collab-test.result }}" != "success" ] || \
             [ "${{ needs.docker-build-test.result }}" != "success" ] || \
             [ "${{ needs.runner-docker-build-test.result }}" != "success" ]; then
            echo "❌ CI checks failed"
            exit 1
          else
            echo "✅ All CI checks passed"
          fi
