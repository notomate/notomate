name: Main Images

# Publishes images of every main commit that passed CI to
# ghcr.io/<owner>/notomate-<svc>, tagged with the 7-char commit SHA and the
# moving `main` tag, e.g. for a staging environment that tracks main
# (see deploy/k8s/README.md).
#
# Opt-in: does nothing unless the repository variable PUBLISH_MAIN_IMAGES is
# set to "true" (Settings -> Secrets and variables -> Actions -> Variables).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: main-images
  cancel-in-progress: true

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    if: >-
      vars.PUBLISH_MAIN_IMAGES == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        target: [api, collab, messaging, nginx]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # workflow_run runs on the default branch's latest commit; build
          # exactly the commit CI tested instead.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Compute tags
        id: tags
        run: |
          SHA="$(git rev-parse --short=7 HEAD)"
          IMAGE="$(echo "$IMAGE_PREFIX/notomate-${{ matrix.target }}" | tr '[:upper:]' '[:lower:]')"
          echo "SHA=$SHA" >> "$GITHUB_OUTPUT"
          echo "TAGS=$IMAGE:$SHA,$IMAGE:main" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}-runtime
          push: true
          build-args: |
            APP_VERSION=main-${{ steps.tags.outputs.SHA }}
            VITE_APP_VERSION=main-${{ steps.tags.outputs.SHA }}
          tags: ${{ steps.tags.outputs.TAGS }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.tags.outputs.SHA }}
          cache-from: type=gha,scope=main-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=main-${{ matrix.target }}
          platforms: linux/amd64
