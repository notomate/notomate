services:
  notomate-mysql:
    image: mysql:8.4
    container_name: notomate-mysql
    env_file: .env
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  notomate-nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx-runtime
    image: notomate/notomate-nginx
    container_name: notomate-nginx
    ports:
      - "8080:80"
    depends_on:
      - notomate-api
      - notomate-collab
      - notomate-messaging
      - notomate-mcp
    restart: unless-stopped

  notomate-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api-runtime
    image: notomate/notomate-api
    container_name: notomate-api
    env_file: .env
    volumes:
      - "./bin:/usr/local/app/bin"
    ports:
      # gRPC port for the runner (docker-compose.runner.yml), which lives in
      # a separate compose project and can't reach notomate-api by service
      # name. Bound to localhost only: the runner protocol has token auth
      # but no TLS.
      - "127.0.0.1:50051:50051"
    depends_on:
      notomate-mysql:
        condition: service_healthy
    restart: unless-stopped

  notomate-collab:
    build:
      context: .
      dockerfile: Dockerfile
      target: collab-runtime
    image: notomate/notomate-collab
    container_name: notomate-collab
    env_file: .env
    depends_on:
      - notomate-api
    restart: unless-stopped

  notomate-messaging:
    build:
      context: .
      dockerfile: Dockerfile
      target: messaging-runtime
    image: notomate/notomate-messaging
    container_name: notomate-messaging
    env_file: .env
    depends_on:
      - notomate-api
    restart: unless-stopped

  notomate-mcp:
    build:
      context: .
      dockerfile: Dockerfile
      target: mcp-runtime
    image: notomate/notomate-mcp
    container_name: notomate-mcp
    env_file: .env
    depends_on:
      - notomate-api
      - notomate-collab
    restart: unless-stopped

volumes:
  mysql_data:
