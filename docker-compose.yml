services:
  notomate-mysql:
    image: mysql:8.4
    container_name: notomate-mysql
    environment:
      - MYSQL_DATABASE=notomate
      - MYSQL_USER=notomate
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-notomate_password}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-notomate_root_password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  notomate-nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx-runtime
    image: notomate/notomate-nginx
    container_name: notomate-nginx
    ports:
      - "8080:80"
    depends_on:
      - notomate-api
      - notomate-collab
      - notomate-messaging
    restart: unless-stopped

  notomate-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api-runtime
    image: notomate/notomate-api
    container_name: notomate-api
    volumes:
      - "./bin:/usr/local/app/bin"
    environment:
      - DB_DRIVER=mysql
      - DB_DSN=notomate:${MYSQL_PASSWORD:-notomate_password}@tcp(notomate-mysql:3306)/notomate?charset=utf8mb4
      - APP_DISABLE_SIGNUP=${APP_DISABLE_SIGNUP}
      - APP_SECRET=${APP_SECRET}
      - MESSAGING_ADDR=http://notomate-messaging:4000
    ports:
      # gRPC port for the runner (docker-compose.runner.yml), which lives in
      # a separate compose project and can't reach notomate-api by service
      # name. Bound to localhost only: the runner protocol has token auth
      # but no TLS.
      - "127.0.0.1:50051:50051"
    depends_on:
      notomate-mysql:
        condition: service_healthy
    restart: unless-stopped

  notomate-collab:
    build:
      context: .
      dockerfile: Dockerfile
      target: collab-runtime
    image: notomate/notomate-collab
    container_name: notomate-collab
    environment:
      - PORT=3000
      - APP_SECRET=${APP_SECRET}
      - GRPC_ADDR=notomate-api:50051
    depends_on:
      - notomate-api
    restart: unless-stopped

  notomate-messaging:
    build:
      context: .
      dockerfile: Dockerfile
      target: messaging-runtime
    image: notomate/notomate-messaging
    container_name: notomate-messaging
    environment:
      - PORT=4000
      - APP_SECRET=${APP_SECRET}
      - GRPC_ADDR=notomate-api:50051
    depends_on:
      - notomate-api
    restart: unless-stopped

volumes:
  mysql_data:
