# notomate-api: REST (8080) + gRPC (50051) for collab/messaging/runner.
#
# Defaults to SQLite + local file storage under /usr/local/app/bin, so it
# must stay a single replica with a Recreate strategy: two pods sharing (or
# racing for) the same RWO volume would corrupt the database.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: notomate-api-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notomate-api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: notomate-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notomate-api
    spec:
      containers:
        - name: api
          image: notomate/notomate-api
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 50051
          env:
            - name: MESSAGING_ADDR
              value: http://notomate-messaging:4000
            - name: APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: notomate-secrets
                  key: APP_SECRET
            - name: APP_DISABLE_SIGNUP
              valueFrom:
                secretKeyRef:
                  name: notomate-secrets
                  key: APP_DISABLE_SIGNUP
                  optional: true
            - name: RUNNER_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: notomate-secrets
                  key: RUNNER_REGISTRATION_TOKEN
                  optional: true
          volumeMounts:
            - name: data
              mountPath: /usr/local/app/bin
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: notomate-api-data
---
apiVersion: v1
kind: Service
metadata:
  name: notomate-api
spec:
  selector:
    app.kubernetes.io/name: notomate-api
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: grpc
      port: 50051
      targetPort: grpc
