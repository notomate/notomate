# notomate-messaging: Socket.IO channel messaging, proxied by nginx at /socket.io/.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notomate-messaging
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notomate-messaging
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notomate-messaging
    spec:
      containers:
        - name: messaging
          image: notomate/notomate-messaging
          ports:
            - name: http
              containerPort: 4000
          env:
            - name: PORT
              value: "4000"
            - name: GRPC_ADDR
              value: notomate-api:50051
            - name: APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: notomate-secrets
                  key: APP_SECRET
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: notomate-messaging
spec:
  selector:
    app.kubernetes.io/name: notomate-messaging
  ports:
    - name: http
      port: 4000
      targetPort: http
