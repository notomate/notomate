# notomate-mcp: MCP server for AI clients, proxied by nginx at /mcp. Stateless.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notomate-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notomate-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notomate-mcp
    spec:
      containers:
        - name: mcp
          image: notomate/notomate-mcp
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: PORT
              value: "5000"
            - name: API_URL
              value: http://notomate-api:8080
            - name: COLLAB_URL
              value: ws://notomate-collab:3000
            - name: APP_PUBLIC_URL
              valueFrom:
                secretKeyRef:
                  name: notomate-secrets
                  key: APP_PUBLIC_URL
                  optional: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: notomate-mcp
spec:
  selector:
    app.kubernetes.io/name: notomate-mcp
  ports:
    - name: http
      port: 5000
      targetPort: http
