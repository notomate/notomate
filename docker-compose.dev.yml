# Dev override: publishes notomate-collab and notomate-messaging on the
# host so a locally-run Vite dev server (web/vite.config.ts proxies
# /ws + /ws/public -> localhost:3000 and /socket.io -> localhost:4000) can
# talk to them directly, without rebuilding notomate-nginx on every
# frontend change.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#   cd web && npm run dev
services:
  # OAuth discovery must point at Vite, or sign-in lands on nginx's built frontend.
  notomate-api:
    environment:
      - APP_PUBLIC_URL=${APP_PUBLIC_URL:-http://localhost:5173}

  notomate-collab:
    ports:
      - "3000:3000"

  notomate-messaging:
    ports:
      - "4000:4000"

  notomate-mcp:
    environment:
      - APP_PUBLIC_URL=${APP_PUBLIC_URL:-http://localhost:5173}
    ports:
      - "5000:5000"
